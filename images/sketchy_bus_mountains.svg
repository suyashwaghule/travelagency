<svg viewBox="0 0 600 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="fill:none; stroke:#16181B; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round;">
  <!-- SUN -->
  <circle cx="300" cy="90" r="35" stroke-width="4" fill="none" />

  <!-- MOUNTAINS -->
  <!-- Main Left Mountain Peak -->
  <path d="M 120 280 L 240 140 L 300 200 L 360 150 L 480 250" stroke-width="4" />
  <path d="M 240 140 L 210 210 L 260 260" stroke-width="3" />
  <path d="M 210 210 L 170 230" stroke-width="2.5" />
  <!-- Right Mountain Peak & Ridge -->
  <path d="M 360 150 L 390 190 L 430 220" stroke-width="3" />
  <path d="M 310 220 L 330 250" stroke-width="2.5" />
  <path d="M 380 240 L 410 260" stroke-width="2.5" />

  <!-- WINDING S-CURVE ROAD -->
  <!-- Top Mountain Pass Origin -->
  <!-- Road Left Border -->
  <path d="M 320 200 C 370 210, 440 240, 420 280 C 400 320, 220 310, 120 370 C 50 410, 50 490, 160 540 C 230 570, 350 580, 480 590" stroke-width="4" />
  
  <!-- Road Right Border -->
  <path d="M 340 200 C 390 215, 460 245, 435 295 C 410 340, 240 335, 150 385 C 80 425, 90 475, 170 515 C 260 550, 390 560, 560 575" stroke-width="4" />

  <!-- Road Center Dashed Line -->
  <path d="M 330 200 C 380 212, 450 242, 427 287 C 405 330, 230 322, 135 377 C 65 417, 70 482, 165 527 C 245 560, 370 570, 520 582" stroke-width="2.5" stroke-dasharray="12,10" />

  <!-- MODERN LUXURY BUS IN PERSPECTIVE (ON THE FOREGROUND ROAD) -->
  <g transform="translate(160, 320)">
    <!-- Bus Body Main Outline -->
    <!-- Roof to Rear -->
    <path d="M 80 40 L 250 20 C 270 18, 290 22, 305 35 L 320 70 C 325 85, 325 110, 320 130 C 315 145, 300 155, 275 158 L 70 140 C 55 138, 40 130, 35 115 L 30 70 C 28 55, 45 42, 80 40 Z" fill="#FAF8F5" stroke-width="4" />

    <!-- Front Windshield Outline -->
    <path d="M 230 30 L 285 30 C 298 30, 308 38, 310 50 L 312 85 C 312 92, 305 95, 292 95 L 230 90 Z" fill="#FAF8F5" stroke-width="3" />
    
    <!-- Windshield Divider / Wiper accent -->
    <path d="M 270 30 L 270 92" stroke-width="2" />
    
    <!-- Front Bumper & Headlight Grille -->
    <path d="M 230 110 L 310 115" stroke-width="3" />
    <path d="M 285 125 C 300 125, 310 122, 312 118" stroke-width="2.5" />
    <!-- Headlight Curve -->
    <path d="M 290 100 Q 305 102, 308 108 Q 295 108, 290 100 Z" stroke-width="2.5" fill="#FAF8F5" />

    <!-- Side Windows -->
    <path d="M 45 55 L 75 52 L 75 90 L 45 92 Z" stroke-width="2.5" fill="#FAF8F5" />
    <path d="M 85 51 L 120 48 L 120 88 L 85 90 Z" stroke-width="2.5" fill="#FAF8F5" />
    <path d="M 130 47 L 165 44 L 165 86 L 130 88 Z" stroke-width="2.5" fill="#FAF8F5" />
    <path d="M 175 43 L 210 40 L 210 84 L 175 86 Z" stroke-width="2.5" fill="#FAF8F5" />

    <!-- Side Mirror -->
    <path d="M 240 45 L 220 40 L 220 65 L 235 60 Z" stroke-width="2.5" fill="#FAF8F5" />

    <!-- Front Wheel -->
    <circle cx="240" cy="148" r="22" stroke-width="4" fill="#FAF8F5" />
    <circle cx="240" cy="148" r="10" stroke-width="3" fill="#16181B" />

    <!-- Rear Wheel -->
    <circle cx="95" cy="138" r="20" stroke-width="4" fill="#FAF8F5" />
    <circle cx="95" cy="138" r="9" stroke-width="3" fill="#16181B" />

    <!-- Wheel Wells Cutouts -->
    <path d="M 215 145 C 215 125, 265 125, 265 148" stroke-width="3.5" fill="none" />
    <path d="M 72 135 C 72 118, 118 118, 118 138" stroke-width="3.5" fill="none" />
  </g>
</svg>
